name: Offline functional validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Version policy
        run: python3 scripts/check_release_consistency.py
      - name: Swift tests with isolated persistence
        run: swift test --build-system native --jobs 4 --scratch-path "$RUNNER_TEMP/visionstack-tests"
  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json
      - name: Restore locked test dependencies
        working-directory: windows
        run: dotnet restore VisionStack.Windows.Tests/VisionStack.Windows.Tests.csproj --locked-mode
      - name: Core tests with fake providers and temporary files
        working-directory: windows
        run: dotnet test VisionStack.Windows.Tests/VisionStack.Windows.Tests.csproj --no-restore --configuration Release
